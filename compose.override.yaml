# للتطوير المحلي فقط (يُحمَّل تلقائيًا). في الإنتاج: docker compose -f compose.yaml up -d
# الشبكة data داخلية فلا تسمح بنشر المنافذ، لذا تُوصَل db وredis بشبكة إضافية ليصل إليهما الجهاز المضيف.
services:
  db:
    ports: ["127.0.0.1:${DB_FORWARD_PORT:-5434}:5432"]
    networks: [data, devhost]
  redis:
    ports: ["127.0.0.1:${REDIS_FORWARD_PORT:-6381}:6379"]
    networks: [data, devhost]
networks:
  devhost: {}
